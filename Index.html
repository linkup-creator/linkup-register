
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>LINKUP – Account aktivieren</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080b0a;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid #26342c;
      border-radius: 20px;
      background: #111713;
    }
    h1 {
      color: #22ff88;
      text-align: center;
      letter-spacing: 3px;
    }
    p {
      color: #b3c0b7;
      line-height: 1.5;
    }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      background: #090e0b;
      border: 1px solid #405246;
      color: white;
    }
    button {
      background: #22ff88;
      border: none;
      color: #07130b;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #message {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>LINKUP</h1>
    <h2>Account aktivieren</h2>
    <p id="description">
      Einladung wird geprüft ...
    </p>

    <form id="form" hidden>
      <input
        id="password"
        type="password"
        minlength="12"
        placeholder="Passwort (mind. 12 Zeichen)"
        autocomplete="new-password"
        required
      >
      <input
        id="confirm"
        type="password"
        placeholder="Passwort wiederholen"
        autocomplete="new-password"
        required
      >
      <button id="submit" type="submit">
        Account aktivieren
      </button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://xwlgfmtywsxrjilaiakv.supabase.co";

    // Hier kommt später der öffentliche
    // Supabase Publishable Key hinein.
    const SUPABASE_KEY = "HIER_PUBLIC_KEY";

    const description =
      document.getElementById("description");
    const form = document.getElementById("form");
    const message =
      document.getElementById("message");

    if (SUPABASE_KEY === "HIER_PUBLIC_KEY") {
      description.textContent =
        "Die Registrierung wird eingerichtet.";
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const { data, error } =
        await supabase.auth.getSession();

      if (error || !data.session) {
        description.textContent =
          "Kein gültiger Einladungslink erkannt.";
      } else {
        description.textContent =
          "Lege jetzt dein LINKUP-Passwort fest.";
        form.hidden = false;

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const password =
            document.getElementById("password").value;
          const confirm =
            document.getElementById("confirm").value;

          if (password !== confirm) {
            message.textContent =
              "Die Passwörter stimmen nicht überein.";
            return;
          }

          if (
            password.length < 12 ||
            !/[A-Za-z]/.test(password) ||
            !/[0-9]/.test(password)
          ) {
            message.textContent =
              "Mindestens 12 Zeichen, Buchstaben und Zahlen.";
            return;
          }

          const button =
            document.getElementById("submit");
          button.disabled = true;

          const { error: updateError } =
            await supabase.auth.updateUser({
              password
            });

          if (updateError) {
            message.textContent =
              "Aktivierung fehlgeschlagen: " +
              updateError.message;
            button.disabled = false;
            return;
          }

          message.textContent =
            "Passwort gespeichert. " +
            "Die LINKUP-Freischaltung folgt.";
          form.hidden = true;

          await supabase.auth.signOut();
        });
      }
    }
  </script>
</body>
</html>
