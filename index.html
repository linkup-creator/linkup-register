
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINKUP – Registrierung</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b0a;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;padding:30px;border:1px solid #26342c;border-radius:20px;background:#111713}
h1{color:#22ff88;text-align:center;letter-spacing:3px}
p{color:#b3c0b7;line-height:1.5}
label{display:block;margin-top:18px}
input,button{width:100%;padding:15px;margin-top:9px;border-radius:10px;font-size:16px}
input{background:#090e0b;border:1px solid #405246;color:white}
button{background:#22ff88;border:0;color:#07130b;font-weight:bold;cursor:pointer;margin-top:22px}
button:disabled{opacity:.55;cursor:wait}
#message{white-space:pre-wrap}
a{color:#22ff88}
</style>
</head>
<body>
<main class="card">
<h1>LINKUP</h1>
<h2>Einladung einlösen</h2>
<p>Gib deine E-Mail-Adresse und deinen persönlichen Invite-Code ein.</p>
<form id="register">
<label for="email">E-Mail-Adresse</label>
<input id="email" type="email" autocomplete="email" required maxlength="254">
<label for="code">Invite-Code</label>
<input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="LINKUP-..." required pattern="LINKUP-[A-Za-z0-9]+">
<button id="submit" type="submit">Einladung anfordern</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>
const params=new URLSearchParams(location.search);
const fragment=new URLSearchParams(location.hash.slice(1));

if(params.has('code')||params.has('token_hash')||params.has('error')||fragment.has('access_token')||fragment.has('error')){
  location.replace('aktivieren.html'+location.search+location.hash);
}

const endpoint='https://xwlgfmtywsxrjilaiakv.supabase.co/functions/v1/linkup-register';
const form=document.getElementById('register');
const msg=document.getElementById('message');
const button=document.getElementById('submit');

form.addEventListener('submit',async e=>{
 e.preventDefault();
 msg.textContent='';
 const email=document.getElementById('email').value.trim().toLowerCase();
 const code=document.getElementById('code').value.trim().toUpperCase();

 if(!/^LINKUP-[A-Z0-9]+$/.test(code)){
   msg.textContent='Ungültiges Invite-Code-Format.';
   return;
 }

 button.disabled=true;

 try{
  const res=await fetch(endpoint,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({email,code})
  });

  const data=await res.json().catch(()=>({}));

  if(!res.ok||!data.success)
    throw new Error(data.error||'Die Einladung konnte nicht angefordert werden.');

  form.hidden=true;
  msg.textContent='Die Einladungs-E-Mail wurde angefordert. Prüfe dein Postfach und gegebenenfalls den Spam-Ordner.';

 }catch(err){
  msg.textContent=err.message||'Verbindung fehlgeschlagen. Bitte später erneut versuchen.';
  button.disabled=false;
 }
});
</script>
</body>
</html>
