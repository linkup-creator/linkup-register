
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>LINKUP – Account aktivieren</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080b0a;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid #26342c;
      border-radius: 20px;
      background: #111713;
    }
    h1 {
      color: #22ff88;
      text-align: center;
      letter-spacing: 3px;
    }
    p {
      color: #b3c0b7;
      line-height: 1.5;
    }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      background: #090e0b;
      border: 1px solid #405246;
      color: white;
    }
    button {
      background: #22ff88;
      border: none;
      color: #07130b;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    #message {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>LINKUP</h1>
    <h2>Account aktivieren</h2>
    <p id="description">
      Einladung wird geprüft ...
    </p>

    <form id="form" hidden>
      <input
        id="password"
        type="password"
        minlength="12"
        placeholder="Passwort (mind. 12 Zeichen)"
        autocomplete="new-password"
        required
      >
      <input
        id="confirm"
        type="password"
        placeholder="Passwort wiederholen"
        autocomplete="new-password"
        required
      >
      <button id="submit" type="submit">
        Account aktivieren
      </button>
    </form>

    <p id="message" role="status"></p>
    <button id="retry" type="button" hidden>
      Freischaltung erneut versuchen
    </button>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://xwlgfmtywsxrjilaiakv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_g19cCupWEemwYs99qi7itw__FxoiDvy";

    const description =
      document.getElementById("description");
    const form =
      document.getElementById("form");
    const message =
      document.getElementById("message");
    const button =
      document.getElementById("submit");
    const retryButton =
      document.getElementById("retry");

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: false,
          persistSession: false
        }
      }
    );

    const hash = new URLSearchParams(
      location.hash.slice(1)
    );
    const query = new URLSearchParams(
      location.search
    );

    const hasInviteData =
      hash.has("access_token") ||
      query.has("code") ||
      query.has("token_hash") ||
      hash.has("error") ||
      query.has("error");

    function clearLink() {
      history.replaceState(
        null, "", location.pathname
      );
    }

    function showError(detail) {
      form.hidden = true;
      description.textContent =
        "Einladung konnte nicht aktiviert werden.";
      message.textContent = detail ||
        "Der Link ist ungültig oder abgelaufen.";
    }

    try {
      const urlError =
        hash.get("error_description") ||
        query.get("error_description") ||
        hash.get("error") ||
        query.get("error");

      if (urlError) {
        throw new Error(
          decodeURIComponent(
            urlError.replace(/\+/g, " ")
          )
        );
      }

      let authError = null;

      if (
        hash.has("access_token") &&
        hash.has("refresh_token")
      ) {
        const result =
          await supabase.auth.setSession({
            access_token:
              hash.get("access_token"),
            refresh_token:
              hash.get("refresh_token")
          });
        authError = result.error;

      } else if (query.has("code")) {
        const result =
          await supabase.auth.exchangeCodeForSession(
            query.get("code")
          );
        authError = result.error;

      } else if (query.has("token_hash")) {
        const result =
          await supabase.auth.verifyOtp({
            token_hash:
              query.get("token_hash"),
            type: "invite"
          });
        authError = result.error;

      } else {
        throw new Error(
          "Kein Einladungsnachweis gefunden. " +
          "Öffne den Link aus deiner E-Mail."
        );
      }

      clearLink();

      if (authError) {
        throw authError;
      }

      const {
        data: userData,
        error: userError
      } = await supabase.auth.getUser();

      if (userError || !userData.user) {
        throw userError ||
          new Error(
            "Keine gültige Anmeldung gefunden."
          );
      }

      async function finishActivation() {
        retryButton.hidden = true;
        message.textContent =
          "Invite-Code wird eingelöst ...";

        try {
          const { data, error } =
            await supabase.rpc(
              "redeem_my_invite"
            );

          if (error) {
            throw error;
          }

          if (data !== true) {
            throw new Error(
              "Der Invite-Code konnte nicht " +
              "eingelöst werden. Bitte prüfe " +
              "die Reservierung."
            );
          }

          description.textContent =
            "Dein LINKUP-Account ist aktiviert!";

          message.textContent =
            "Passwort gespeichert und " +
            "Invite-Code erfolgreich eingelöst. " +
            "Du kannst dich jetzt anmelden.";

          await supabase.auth.signOut();

        } catch (error) {
          description.textContent =
            "Passwort gespeichert – " +
            "Freischaltung noch offen.";

          message.textContent =
            "Freischaltung fehlgeschlagen: " +
            error.message;

          retryButton.hidden = false;
        }
      }

      retryButton.addEventListener(
        "click",
        finishActivation
      );

      description.textContent =
        "Lege jetzt dein LINKUP-Passwort fest.";

      form.hidden = false;

      form.addEventListener(
        "submit",
        async (e) => {
          e.preventDefault();
          message.textContent = "";

          const password =
            document.getElementById(
              "password"
            ).value;

          const confirm =
            document.getElementById(
              "confirm"
            ).value;

          if (password !== confirm) {
            message.textContent =
              "Die Passwörter stimmen " +
              "nicht überein.";
            return;
          }

          if (
            password.length < 12 ||
            !/[A-Za-z]/.test(password) ||
            !/[0-9]/.test(password)
          ) {
            message.textContent =
              "Mindestens 12 Zeichen, " +
              "Buchstaben und Zahlen.";
            return;
          }

          button.disabled = true;

          try {
            const { error } =
              await supabase.auth.updateUser({
                password
              });

            if (error) {
              throw error;
            }

            form.hidden = true;

            document.getElementById(
              "password"
            ).value = "";

            document.getElementById(
              "confirm"
            ).value = "";

            description.textContent =
              "Passwort erfolgreich gespeichert.";

            await finishActivation();

          } catch (error) {
            message.textContent =
              "Passwort konnte nicht " +
              "gespeichert werden: " +
              error.message;

            button.disabled = false;
          }
        }
      );

    } catch (error) {
      if (hasInviteData) {
        clearLink();
      }
      showError(error.message);
    }
  </script>
</body>
</html>
