
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINKUP – Account aktivieren</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b0a;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;padding:30px;border:1px solid #26342c;border-radius:20px;background:#111713}
h1{color:#22ff88;text-align:center;letter-spacing:3px}
p{color:#b3c0b7;line-height:1.5}
input,button{width:100%;padding:15px;margin-top:12px;border-radius:10px;font-size:16px}
input{background:#090e0b;border:1px solid #405246;color:white}
button{background:#22ff88;border:0;color:#07130b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
a{color:#22ff88}
</style>
</head>
<body>
<main class="card">
<h1>LINKUP</h1>
<h2>Account aktivieren</h2>
<p id="description">Einladung wird geprüft …</p>

<form id="form" hidden>
<input id="password" type="password" minlength="12" autocomplete="new-password" placeholder="Passwort (mind. 12 Zeichen)" required>
<input id="confirm" type="password" minlength="12" autocomplete="new-password" placeholder="Passwort wiederholen" required>
<button id="submit" type="submit">Passwort speichern</button>
</form>

<p id="message" role="status" aria-live="polite"></p>
<p><a href="./">Zur Registrierung</a></p>
</main>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const supabase=createClient(
 'https://xwlgfmtywsxrjilaiakv.supabase.co',
 'sb_publishable_g19cCupWEemwYs99qi7itw__FxoiDvy',
 {auth:{
   detectSessionInUrl:false,
   persistSession:false,
   autoRefreshToken:false
 }}
);

const description=document.getElementById('description');
const form=document.getElementById('form');
const message=document.getElementById('message');
const button=document.getElementById('submit');

const query=new URLSearchParams(location.search);
const hash=new URLSearchParams(location.hash.slice(1));

function clearUrl(){
 history.replaceState(null,'',location.pathname);
}

try{
 const errorDescription=
   hash.get('error_description')||
   query.get('error_description')||
   hash.get('error')||
   query.get('error');

 if(errorDescription)
   throw new Error('Der Einladungslink ist abgelaufen oder ungültig. Bitte fordere eine neue Einladung an.');

 let result;

 if(hash.has('access_token')&&hash.has('refresh_token')){
  result=await supabase.auth.setSession({
   access_token:hash.get('access_token'),
   refresh_token:hash.get('refresh_token')
  });

 }else if(query.has('code')){
  result=await supabase.auth.exchangeCodeForSession(
   query.get('code')
  );

 }else if(query.has('token_hash')){
  result=await supabase.auth.verifyOtp({
   token_hash:query.get('token_hash'),
   type:'invite'
  });

 }else{
  throw new Error('Kein Einladungsnachweis gefunden. Öffne den Link aus deiner neuen Einladungs-E-Mail.');
 }

 clearUrl();

 if(result.error)throw result.error;

 const {data,error}=await supabase.auth.getUser();

 if(error||!data.user)
   throw new Error('Die Einladung konnte nicht bestätigt werden.');

 description.textContent='Lege jetzt dein LINKUP-Passwort fest.';
 form.hidden=false;

 form.addEventListener('submit',async e=>{
  e.preventDefault();
  message.textContent='';

  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;

  if(password!==confirm){
   message.textContent='Die Passwörter stimmen nicht überein.';
   return;
  }

  if(password.length<12||!/[A-Za-z]/.test(password)||!/[0-9]/.test(password)){
   message.textContent='Mindestens 12 Zeichen, Buchstaben und Zahlen.';
   return;
  }

  button.disabled=true;

  try{
   const {error}=await supabase.auth.updateUser({password});

   if(error)throw error;

   form.hidden=true;
   description.textContent='Passwort gespeichert.';
   message.textContent='Dein Passwort wurde gespeichert. Die endgültige Invite-Code-Freischaltung wird noch im Backend eingerichtet.';

   await supabase.auth.signOut();

  }catch(err){
   message.textContent='Passwort konnte nicht gespeichert werden: '+err.message;
   button.disabled=false;
  }
 });

}catch(err){
 clearUrl();
 description.textContent='Einladung konnte nicht aktiviert werden.';
 message.textContent=err.message||'Bitte fordere eine neue Einladung an.';
}
</script>
</body>
</html>
